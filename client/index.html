<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Port Slice - Destructible Terrain</title>
    <style>
      body { margin: 0; padding: 0; background-color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; }
      #game-container { border: 2px solid #555; }
    </style>
  </head>
  <body>
    <div style="position: relative; width: 1300px; height: 700px;">
      <div id="game-container"></div>
      
      <!-- UI Layer -->
          
          <div style="text-align: center;">
             <div id="turn-timer" style="background: rgba(0,0,0,0.7); color: white; padding: 10px; font-size: 32px; border-radius: 5px; font-weight: bold;">60</div>
             <div id="active-team-text" style="background: rgba(0,0,0,0.7); color: white; padding: 5px; margin-top: 5px; border-radius: 5px; font-size: 14px;">Red Turn</div>
             <div id="wind-indicator" style="background: rgba(0,0,0,0.7); color: white; padding: 5px; margin-top: 5px; border-radius: 5px; font-size: 14px;">Wind: 0</div>
          </div>
          
          <div id="weapon-selector" style="background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; gap: 5px;">
            <div style="font-size: 12px; margin-bottom: 5px; margin-top: 10px;">MAP</div>
            <select id="mapSelect">
                <!-- Dynamically populated -->
            </select>
            <div id="aim-power" style="margin-top: 5px; font-size: 12px; display: none;">Power: <span id="power-val">0</span>%</div>
          </div>
        </div>
        
        <div id="game-over-screen" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; display: none;">
            <h1 id="winner-text" style="color: white; font-size: 48px; margin-bottom: 20px;">Game Over</h1>
            <button id="btn-restart" style="padding: 10px 20px; font-size: 24px; cursor: pointer; border-radius: 5px; background: #fff; color: #000; border: none;">Play Again</button>
        </div>
        
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
